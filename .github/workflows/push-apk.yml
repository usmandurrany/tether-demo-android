# One-off: builds the debug APK with Firebase push, using the
# GOOGLE_SERVICES_JSON repo secret. This branch is deleted after the build.
name: Push-enabled APK
on:
  push:
    branches: [claude/push-apk-build]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Write google-services.json from the secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::error::GOOGLE_SERVICES_JSON secret is not set"; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 -c 'import json; json.load(open("app/google-services.json"))'
      - run: ./gradlew assembleDebug --stacktrace
      - name: Check Firebase was applied
        run: find app/build/generated -path '*GoogleServices*' -name values.xml | grep .
      - uses: actions/upload-artifact@v4
        with:
          name: tether-demo-push-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
